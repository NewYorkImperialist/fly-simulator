[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "fly-simulator"
version = "0.1.0"
description = "A NeuroMechFly fruit fly (FlyGym 2.x / MuJoCo) driven by a whole-brain FlyWire connectome model: endless terrain, whips, looming escapes, flight and brain games"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT AND CC-BY-NC-4.0 AND Apache-2.0"  # code MIT; bundled FlyWire-derived atlas CC BY-NC 4.0; grooming clip Apache-2.0 (NOTICE.md)
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Jayden Lin" }]
keywords = [
    "drosophila", "fruit-fly", "neuromechfly", "flygym", "mujoco", "connectome",
    "flywire", "computational-neuroscience", "simulation", "reinforcement-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "flygym==2.1.0",        # pins mujoco>=3.9,<3.10; includes flygym_demo controllers
    "numpy>=2.0",
    "opencv-python>=4.9",   # live window + keyboard
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Residual-RL env + PPO training (fly_simulator.rl, scripts/train_ppo.py). torch comes
# in through stable-baselines3; tensorboard is optional (--tensorboard).
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "tensorboard>=2.15",
]
# Whole-brain connectome model (fly_simulator.brain, docs/BRAIN.md). numba runs the
# engine; pyarrow reads the FlyWire parquet/feather files; brian2 is only needed for
# the reference cross-check in scripts/bench_brain.py and tests.
brain = [
    "numba>=0.60",
    "pyarrow>=15",
    "scipy>=1.11",
]
brain-ref = [
    "brian2>=2.7",
]
# Real vision (--real-vision; fly_simulator/vision/flyvis_net.py, docs/VISION.md):
# flyvis connectome-constrained visual system (Lappalainen et al. 2024; ~230 MB of
# dependencies, torch included). Then fetch the pretrained models (~10 MB):
#   .venv/bin/flyvis download-pretrained --skip_large_files
vision = [
    "flyvis==1.2.0",
]

[project.urls]
Homepage = "https://github.com/NewYorkImperialist/fly-simulator"
Repository = "https://github.com/NewYorkImperialist/fly-simulator"
Issues = "https://github.com/NewYorkImperialist/fly-simulator/issues"

[project.scripts]
fly-simulator = "fly_simulator.app:main"

[tool.setuptools.packages.find]
include = ["fly_simulator*"]

# Non-Python files needed at runtime (the brain window's neuropil atlas). The
# preview image in the same folder is documentation only and stays out of wheels.
[tool.setuptools.package-data]
"fly_simulator.brain_viz" = ["assets/*.json"]
"fly_simulator.actions" = ["data/*.npz"]  # recorded grooming kinematics (Groom action)

[tool.pytest.ini_options]
testpaths = ["tests"]
